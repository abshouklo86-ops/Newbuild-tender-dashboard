name: Official Sources Check
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,13 * * *'
permissions:
  contents: write
concurrency:
  group: official-sources-check
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan public official pages
        run: python official_discover.py
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official_candidates.json official_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official source monitor"
            git push
          fi
