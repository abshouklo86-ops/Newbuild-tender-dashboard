
name: Automatic Tender Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,13 * * *'

permissions:
  contents: write

concurrency:
  group: tender-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover tender candidates
        run: python discover.py

      - name: Save discovery results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- candidates.json discovery_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update discovered tender candidates"
            git push
          fi
